<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Page</title>
    <link id="dynamicFavicon" rel="icon" type="image/png" href="" />    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jspreadsheet-ce@4/dist/jspreadsheet.min.css" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/jspreadsheet-ce@4/dist/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsuites@4/dist/jsuites.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsuites@4/dist/jsuites.min.css" type="text/css" />    
    <link rel="stylesheet" href="StudentStyle.css">
</head>
<body>
    <div id="MainBody">     
        <div id="SchoolNameBox">
            <img id="SchoolLogo" src="" alt="Logo">
            <div id="SchoolName">School Name Loading ........</div>
            <div id="SchoolAddress">School Address Loading ........</div>
        </div>   
        <div id="PageNaviggationBox">
            <button type="button" id="btnCalculator" onclick="openCalculator()">Calculator</button>
            <select id="PageNavigationSelect">   
                <option>Student</option>
                <option value="HumanResourcePage">Human Resource</option>
                <option value="GalleryPage">Gallery</option>
                <option value="QuestionBankPage">Question Bank</option>
                <option value="NoticePage">Notice</option>
                <option value="LibraryPage">Library</option>
                <option value="HomePage">Home</option>
                <option value="BalPratibhaPage">Bal Pratibha</option>
                <option value="AboutUsPage">About Us</option>
                <option value="SMC_TGC_Page">SMC & TGC</option>
                <option value="HelpingHandPage">Helping Hand</option>
                <option value="AdminPage">Admin</option>                
            </select>
            <button type="button" id="btnCalendar" onclick="showCalendar()">Calendar</button>
        </div>
        <div id="FilterControlPanel">
            <div class="filters-inner-row">
                <div class="filter-group">
                    <label class="filter-header-label">Classes</label>
                    <div id="FilterClassDropdown" class="custom-multiselect-panel bg-class"></div>
                </div>
                <div class="filter-group">
                    <label class="filter-header-label">Streams</label>
                    <div id="FilterStreamDropdown" class="custom-multiselect-panel bg-stream"></div>
                </div>
                <div class="filter-group">
                    <label class="filter-header-label">Houses</label>
                    <div id="FilterHouseDropdown" class="custom-multiselect-panel bg-house"></div>
                </div>
                <div class="filter-group">
                    <label class="filter-header-label">Races</label>
                    <div id="FilterRaceDropdown" class="custom-multiselect-panel bg-race"></div>
                </div>
                <div class="filter-group">
                    <label class="filter-header-label">Genders</label>
                    <div id="FilterGenderDropdown" class="custom-multiselect-panel bg-gender"></div>
                </div>
            </div>
            <div id="FilterActionContainer" style="display: none;">
                <button id="btnApplyGridFilters" onclick="applyActiveFilters()">Apply Filters</button>
            </div>
        </div>

        <div id="StudentDataBox"></div>

        <div id="ActionBarBox" style="display: none;">
            <span class="export-label">Export Data As:</span>
            <button class="btn-export" onclick="exportData('excel')">Excel Spreadsheet</button>
            <button class="btn-export" onclick="exportData('pdf')">PDF Document</button>
            <button class="btn-export" onclick="exportData('jpg')">JPG Image</button>
        </div>
    <div id="StudentDetailModal" class="modal-overlay">
        <div class="modal-content">
            <span class="modal-close-btn" onclick="closeStudentModal()">&times;</span>
            <div class="modal-scroll-container">
                <div class="modal-body-layout">
                    <div class="modal-photo-pane">
                        <img id="ModalStudentPhoto" src="" alt="Student Profile Picture">
                    </div>
                    <div class="modal-info-pane">
                        <h2 id="ModalStudentName">Student Profile</h2>
                        <hr>
                        <div id="ModalDetailsSingleColumn"></div>
                    </div>
                </div>
                <div class="modal-save-jpg-container">
                    <button class="btn-modal-save" onclick="saveModalAsJPG()">Save Profile as Image (JPG)</button>
                </div>
            </div>
        </div>
    </div>
    <div id="FooterBox">
        <a href="../index.html">Home</a>
        <a href="../AdminPage/AdminIndex.html">Admin</a>
        <a href="../BalPratibhaPage/BalPratibhaIndex.html">Bal Pratibha</a>
        <a href="../HelpingHandPage/HelpingHandIndex.html">Helping Hand</a>
        <a href="../HumanResourcePage/HumanResourceIndex.html">Human Resources</a>
        <a href="../LibraryPage/LibraryIndex.html">Library</a>
        <a href="../NoticePage/NoticeIndex.html">Notice</a>
        <a href="../QuestionBankPage/QuestionBankIndex.html">Question Bank</a>
        <a href="../SMC_TGC_Page/SMC_TGC_Index.html">SMC & TGC</a>
        <a href="../GalleryPage/GalleryIndex.html">Gallery</a>        
    </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../SupabaseConfig.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>    
    <script src="../NepaliCalendar.js"></script>
    <script src="../SmartCalculator.js"></script>
    <script src="StudentScript.js"></script>
</body>
</html>
