<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://bossanova.uk/jspreadsheet/v4/jexcel.css" type="text/css" />
    <link rel="stylesheet" href="https://jsuites.net/v4/jsuites.css" type="text/css" />
    <title>Admin Page</title>
    <link id="dynamicFavicon" rel="icon" type="image/png" href="" />
    <style>
        @font-face {
            font-family: 'MySanskritFont';
            src: url('../Sanskrit-2003.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        html{
            width: 100%;
            height: auto;
            display: flex;
            flex-direction: column;
            align-items: center;  
            font-size: 62.5%;
        }
        body { 
            width: 100%;
            height: auto;
            font-family: Arial, sans-serif; 
            min-height: 100%;
            font-family: 'Arial', 'MySanskritFont', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;  
        }

        #MainBody{
            width: 96%;
            height: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #ffaaaa;
            min-height: 100%;
            margin: 0 auto;    
            padding: 0 clamp(0.4rem, 0.6rem, 1rem);   
        }

        #PageNaviggationBox {
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            background: #000000;
            padding: clamp(0.3rem, 1rem, 1.6rem);
            text-align: center;
        }
        #LogoBox{
            width: 6%;
            height: auto;     
        }
        #LogoBox img{
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #PageNavigationSelect{
            width: 50%;
            font-size: clamp(1.2rem, 2vw, 3rem);
            font-weight: bold;
            padding: clamp(0.3rem, 1rem, 1.6rem);;
            border: 4px solid #000000;
        }
        #PageNaviggationBox button{
            width: 20%;
            padding: clamp(0.3rem, 1rem, 1.6rem) 0;
            background: linear-gradient(180deg, #00aa00, #00cc00, #00aa00);
            color: #ffffff;
            border-radius: 4vw;  
            font-size: clamp(1rem, 2vw, 3rem);  
            font-weight: bold;
            cursor: pointer;
        }
        #pageNaviggationBox button:hover{
            background: linear-gradient(180deg, #009900, #00aa00, #009900);
            color: #ffff00;
        }
        #DateBox{
            width: 100%;
            text-align: center;
            font-size: clamp(1.2rem, 3vw, 2.5rem);
            font-weight: 800;
            color: #ffff00;
            padding: clamp(0.3rem, 1rem, 1.6rem);   
            background: linear-gradient(180deg, #111111, #333333); 
        }
        #UtilityBox{
            width: 100%;
            height: auto;
            background: linear-gradient(180deg, #333333, #555555);
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-evenly;
            padding: clamp(0.3rem, 1rem, 1.6rem) 0;
        }
        #EditNavigationSelect, #AdminToolsSelect{
            width: 48%;
            font-size: clamp(1.2rem, 2vw, 3rem);
            font-weight: bold;
            padding: clamp(0.3rem, 1rem, 1.6rem) 0;
            border: 4px solid #000000;
        }
        #AboutUsEditBox{
            width: 100%;
            padding: clamp(1rem, 2vw, 3rem);
            box-sizing: border-box;
            flex-direction: column;
            align-items: center;
        }
        #EditAboutUsHead{
            width: 100%;
            text-align: center;
            font-size: clamp(1.4rem, 4vw, 6rem);
            font-weight: bold;
            margin-bottom: 1.1rem;
            color: #0000aa
        }
        .EditAboutUsBoxes {
            width: 100%;
            display: flex;
            flex-direction: row;
            align-items: center;  
            margin: clamp(0.3rem, 1vw, 1.6rem) 0;  
        }
        .EditAboutUsBoxes div {
            width: 30%;
            font-size: clamp(1rem, 2vw, 4rem);
            font-weight: bold;    
            padding: clamp(0.3rem, 1vw, 1.6rem) 0;
        }
        .EditAboutUsBoxes input {
            width: 70%;
            font-size: clamp(1.2rem, 2vw, 3rem);
            font-weight: bold;
            padding: clamp(0.3rem, 1vw, 1.6rem);
        }
        #AddSocialMedisBox{
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .SocialMediaMainBoxes{
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid #555555;
            background: linear-gradient(135deg, #cccccc, #eeeeee);
            padding: clamp(0.3rem, 1vw, 1.6rem);
            margin: clamp(0.3rem, 1vw, 1.6rem) 0;
        }
        .UpperSocialMediaBoxes, .LowerSocialMediaBoxes{
            width: 100%;
            display: flex;
            flex-direction: row;
            align-items: center;
        }
        .UpperSocialMediaBoxes label, .LowerSocialMediaBoxes label{
            flex: 0 0 30%;
            font-size: clamp(1rem, 2vw, 4rem);
            font-weight: bold;
            padding: clamp(0.3rem, 1vw, 1.6rem) 0;
            color: #000000;
            margin: clamp(0.3rem, 1vw, 1.6rem);
        }
        .UpperSocialMediaBoxes input, .LowerSocialMediaBoxes input{
            flex: 1 1 70%;
            font-size: clamp(1rem, 2vw, 4rem);
            font-weight: bold;
            padding: clamp(0.3rem, 1vw, 1.6rem) 0;
            color: #000000;
            margin: clamp(0.3rem, 1vw, 1.6rem);
        }
        #AboutUsLogoSelectBox{
            width: 100%;
            display: flex;
            flex-direction: row;
            align-items: center;
            margin: clamp(0.3rem, 1vw, 1.6rem) 0;
            border: 2px solid #333333;
            padding: clamp(0.3rem, 1vw, 2rem);
            background: linear-gradient(135deg, #ffaaff, #ffccff);
        }
        #AboutUsLogoSelectBox label{
            flex: 0 0 30%;
            box-sizing: border-box;
            font-size: clamp(1rem, 2vw, 4rem);
            font-weight: bold;  
            padding: clamp(0.3rem, 1vw, 1.6rem) 0;
        }
        #SelectLogoFile{ display: none; }
        #btnChooseLogoFile{
            flex: 0 0 20%;
            box-sizing: border-box;
            background: linear-gradient(180deg, #00aa00, #00cc00, #00aa00);
            color: #ffffff;
            border-radius: 4vw;  
            font-size: clamp(1.2rem, 2vw, 3rem); 
            padding: clamp(0.3rem, 1vw, 1.6rem) 0; 
            font-weight: bold;
        }
        #AboutUsLogoName{
            flex: 1 1 200px;
            box-sizing: border-box;
            font-size: clamp(1rem, 2vw, 4rem);
            font-weight: bold;  
            padding: clamp(0.3rem, 1vw, 1.6rem);
            color: #0000aa;
        }

        #ImportantContactBox{
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: clamp(0.3rem, 1vw, 1.6rem);
            margin: clamp(1rem, 2vw, 3rem) 0;
            border: 2px solid #333333;
            background: linear-gradient(135deg, #ffffaa, #cccc88);
        }
        #ImportantContactHead{
            width: 100%;
            box-sizing: border-box;
            font-size: clamp(1rem, 2vw, 4rem);
            font-weight: bold;  
            padding: clamp(0.3rem, 1vw, 1.6rem);
            color: #0000aa;
            text-align: center;
        }
        #AboutUsImportantContactBox{
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            
        }
        .ImportantContactBoxes{
            width: 100%;
            border: 2px solid #333333;
            padding: clamp(0.3rem, 1vw, 1.6rem);
            margin: clamp(0.3rem, 1vw, 1.6rem);
            background: #ffffff;
        }
        .ImportantContactFirstBoxes, 
        .ImportantContactSecondBoxes, 
        .ImportantContactThirdBoxes, 
        .ImportantContactFourthBoxes {
            width: 100%;
            display: flex;
            flex-direction: row;
            align-items: center;
            margin: 0.5rem 0;
        }
        .ImportantContactBoxes label {
            flex: 0 0 30%;
            font-size: clamp(1rem, 2vw, 4rem);
            font-weight: bold;
            padding: clamp(0.3rem, 1vw, 2rem);
            
        }
        .ImportantContactBoxes input {
            flex: 1 1 70%;
            font-size: clamp(1rem, 2vw, 4rem);
            font-weight: bold;
            padding: clamp(0.3rem, 1vw, 2rem);
        }
        .ImportantContactFourthBoxes input{
            display: none;
        }
        .ImportantContactFourthBoxes button{
            flex: 0 0 20%;
            font-size: clamp(1rem, 2vw, 4rem);
            font-weight: bold;
            padding: clamp(0.3rem, 1vw, 2rem);
            background: linear-gradient(180deg, #006600, #008800, #006600);
            color: #ffffff;
            border-radius: 4vw;
        }
        .ImportantContactFourthBoxes button:hover{
            background: linear-gradient(180deg, #004400, #006600, #004400);
            color: #ffff00;
        }
        .ImportantContactFourthBoxes div{
            width: 50%;
            font-size: clamp(1rem, 2vw, 4rem);
            font-weight: bold;
            padding: clamp(0.3rem, 1vw, 2rem);   
            color: #0000aa; 
        }

        #SocialMediaEditBox{
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid #333333;
            padding: clamp(0.3rem, 1vw, 1.6rem);
            background: linear-gradient(135deg, #6666aa, #6666cc);
        }
        #AboutUsSocialMediaBox{
            width: 100%;
        }
        #SocialMediaHead{
            width: 100%;
            font-size: clamp(1rem, 2vw, 3rem);
            font-weight: bold;
            color: #0000aa;
            padding: clamp(0.3rem, 1vw, 1.6rem) 0;
            text-align: center;
        }
        .SocialMediaBoxes{
            width: 100%;
            display: flex;
            flex-direction: row;
            align-items: center;
            border: 2px solid #333333;
            padding: clamp(0.3rem, 1vw, 1.6rem);
            background: linear-gradient(135deg, #cccccc, #eeeeee);
            margin: clamp(0.3rem, 1vw, 1.6rem) 0;
        }
        .SocialMediaBoxes label{
            flex: 0 0 30%;
            font-size: clamp(1rem, 2vw, 4rem);
            padding: clamp(0.3rem, 1vw, 1.6rem);
            margin: clamp(1rem, 2vw, 3rem) 0;
        }
        .SocialMediaBoxes input{
            flex: 0 0 70%;
            font-size: clamp(1rem, 2vw, 4rem);
            padding: clamp(0.3rem, 1vw, 1.6rem);
            margin: clamp(1rem, 2vw, 3rem) 0;
        }
        #SliderPictureSelectBox{
            width: 100%;
            display: flex;
            flex-direction: column;
            padding: clamp(0.3rem, 1vw, 1.6rem);
            margin: clamp(1rem, 2vw, 3rem) 0;
            border: 2px solid #333333;
        }
        #SliderEditBox{
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid #333333;
            padding: clamp(0.3rem, 1vw, 1.6rem);
            background: linear-gradient(135deg, #66aa66, #66cc66);
        }
        #AboutUsSliderBox{
            width: 100%;
        }
        #SliderPictureSelectHead{
            width: 100%;
            font-size: clamp(1rem, 2vw, 3rem);
            font-weight: bold;
            color: #0000aa;
            padding: clamp(0.3rem, 1vw, 1.6rem) 0;
            text-align: center;
        }
        .SliderPictureSelectBoxes{
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 2px solid #333333;
            padding: clamp(0.3rem, 1vw, 1.6rem);
            background: linear-gradient(135deg, #cccccc, #eeeeee);
            margin: clamp(0.3rem, 1vw, 1.6rem) 0;
        }
        .InnerBoxes{
            width: 100%;
            display: flex;
            flex-direction: row;
            align-items: center;
        }
        .InnerBoxes label{
            flex: 0 0 30%;
            box-sizing: border-box;
            font-size: clamp(1rem, 2vw, 4rem);
            font-weight: bold;  
            padding: clamp(0.3rem, 1vw, 1.6rem) 0;
        }
        .InnerBoxes input{
            display: none;
        }
        .InnerBoxes button{
            flex: 0 0 20%;
            box-sizing: border-box;
            background: linear-gradient(180deg, #004400, #006600, #004400);
            color: #ffffff;
            border-radius: 4vw;  
            font-size: clamp(1.2rem, 2vw, 3rem); 
            padding: clamp(0.3rem, 1vw, 1.6rem) 0; 
            font-weight: bold;
        }
        .InnerBoxes button:hover{
            background: linear-gradient(180deg, #002200, #004400, #002200);
            color: #ffff00;
        }
        .InnerBoxes div{
            width: 50%;
            font-size: clamp(1rem, 2vw, 4rem);
            font-weight: bold;
            padding: clamp(0.3rem, 1vw, 1.6rem);
            color: #0000aa;
        }
        .SliderCredentialBoxes{
            width: 100%;
            display: flex;
            flex-direction: row;
            align-items: center;
            padding: clamp(0.3rem, 1vw, 1.6rem) 0;
        }
        .SliderCredentialBoxes label{
            flex: 0 0 30%;
            box-sizing: border-box;
            font-size: clamp(1rem, 2vw, 4rem);
            font-weight: bold;
            padding: clamp(0.3rem, 1vw, 1.6rem) 0;
        }
        .SliderCredentialBoxes input{
            flex: 1 1 70%;
            box-sizing: border-box;
            font-size: clamp(1rem, 2vw, 4rem);
            font-weight: bold;
            padding: clamp(0.3rem, 1vw, 1.6rem);
        }
        #btnSaveAboutUs {
            display: block;
            width: 50%;
            max-width: 400px;
            margin: clamp(1rem, 2vw, 3rem) auto !important;    
            font-size: clamp(1rem, 2vw, 3rem);
            font-weight: bold;
            background: linear-gradient(180deg, #000044, #000066, #000044);
            color: #ffffff;
            border-radius: 4vw;
            padding: clamp(0.3rem, 1vw, 1.6rem);
        }
        #btnSaveAboutUs:hover{
            background: linear-gradient(180deg, #000022, #000044, #000022);
            color: #ffff00;
        }
    </style>
</head>
<body>
    <div id="MainBody">
        <div id="PageNaviggationBox">
            <div id="LogoBox"><img src="" alt="Logo" width="100" height="100"></div>
            <button type="button" id="btnCalculator" onclick="openCalculator()">Calculator</button>
            <select id="PageNavigationSelect">   
                <option value="AdminPage">Admin</option>
                <option value="LibraryPage">Library</option>
                <option value="NoticePage">Notice</option>
                <option value="QuestionBankPage">Question Bank</option>
                <option value="StudentPage">Students</option>
                <option value="TeacherPage">Teachers</option>
                <option value="BalPratibhaPage">Bal Pratibha</option>
                <option value="AboutUsPage">About Us</option>
                <option value="GalleryPage">Gallery</option>
                <option value="SMC_TGC_Page">SMC & TGC</option>
                <option value="HelpingHandPage">Helping Hand</option>
                <option value="HomePage">Home</option>
            </select>
            <button type="button" id="btnCalendar" onclick="showCalendar()">Calendar</button>
        </div>  
        <div id="DateBox"></div>
        <div id="UtilityBox">
            <select id="EditNavigationSelect">
                <option>Edit About Us</option>
                <option value="AttendanceCardEditBox">Edit Attendance Cards</option>
                <option value="IDCardEditBox">Edit ID Cards</option>
                <option value="ResultEditBox">Edit Result</option>
                <option value="RoutineEditBox">Edit Routine</option>
                <option value="StudentAttendanceEditBox">Edit Student Attendance</option>
                <option value="LibraryEditBox">Edit Library</option>
                <option value="NoticeEditBox">Edit Notice</option>
                <option value="QuestionBankEditBox">Edit Question Bank</option>
                <option value="StudentEditBox">Edit Student Data</option>
                <option value="TeacherEditBox">Edit Teacher Data</option>
                <option value="CalendarEditBox">Edit Calendar</option>
                <option value="BalPratibhaEditBox">Edit Bal Pratibha</option>
                <option value="GalleryEditBox">Edit Gallery</option>
                <option value="HelpingHandEditBox">Edit Helping Hand</option>
                <option value="SMC_TGC_EditBox">Edit SMC & TGC</option>
                <option value="AdminEditBox">Admin</option>
            </select>
            <select id="AdminToolsSelect">
                <option disabled selected>Admin Tools</option>
                <option value="ChangePasswordTool">Change Password</option>
                <option value="LogoutThisDeviceTool">Logout This Device</option>
                <option value="LogoutAllDevicesTool">Logout All Devices</option>
                <option value="AddAdminTool">Add/Delete Admin</option>
            </select>            
        </div>      
        <div id="AboutUsEditBox" class="EditBoxes">
            <div id="EditAboutUsHead">Edit School Details</div>
            <div class="EditAboutUsBoxes"><div>School Name:</div><input type="text" id="SchoolName" /></div>
            <div class="EditAboutUsBoxes"><div>School Address:</div><input type="text" id="SchoolAddress" /></div>
            <div class="EditAboutUsBoxes"><div>School Mobile:</div><input type="text" id="SchoolContact" /></div>
            <div class="EditAboutUsBoxes"><div>School Email:</div><input type="text" id="SchoolEmail" /></div>
            <div class="EditAboutUsBoxes"><div>Website:</div><input type="text" id="SchoolWebsite" /></div>
            
            <div id="ImportantContactBox">
                <div id="ImportantContactHead">Add Some Important Contacts</div>
                <div id="AboutUsImportantContactBox">
                    <!-- Important Contacts will be populated here -->
                    <div class="ImportantContactBoxes" id="contact_Principal">
                        <div class="ImportantContactFirstBoxes"><label>Principal Name:</label><input type="text" id="PrincipalName" placeholder="Enter Principal Name"/></div>
                        <div class="ImportantContactSecondBoxes"><label>Principal Contact:</label><input type="text" id="PrincipalContact" placeholder="Enter Principal Contact"/></div>
                        <div class="ImportantContactThirdBoxes"><label>Principal Email:</label><input type="text" id="PrincipalEmail" placeholder="Enter Principal Email"/></div>
                        <div class="ImportantContactFourthBoxes"><label>Principal Photo:</label><input type="file" id="PrincipalPhotoFile" accept=".jpg, .jpeg, .png, .webp, .gif"/><button type="button" id="btnSelectPrincipalPhoto" onclick="document.getElementById('PrincipalPhotoFile').click()">Choose Photo</button><div id="PrincipalPhotoName">No file chosen</div></div>
                    </div>
                    <div class="ImportantContactBoxes" id="contact_SMCHead">
                        <div class="ImportantContactFirstBoxes"><label>SMCHead Name:</label><input type="text" id="SMCHeadName" placeholder="Enter SMCHead Name"/></div>
                        <div class="ImportantContactSecondBoxes"><label>SMCHead Contact:</label><input type="text" id="SMCHeadContact" placeholder="Enter SMCHead Contact"/></div>
                        <div class="ImportantContactThirdBoxes"><label>SMCHead Email:</label><input type="text" id="SMCHeadEmail" placeholder="Enter SMCHead Email"/></div>
                        <div class="ImportantContactFourthBoxes"><label>SMCHead Photo:</label><input type="file" id="SMCHeadPhotoFile" accept=".jpg, .jpeg, .png, .webp, .gif"/><button type="button" id="btnSelectSMCHeadPhoto" onclick="document.getElementById('SMCHeadPhotoFile').click()">Choose Photo</button><div id="SMCHeadPhotoName">No file chosen</div></div>
                    </div>
                    <div class="ImportantContactBoxes" id="contact_VicePrincipal">
                        <div class="ImportantContactFirstBoxes"><label>VicePrincipal Name:</label><input type="text" id="VicePrincipalName" placeholder="Enter VicePrincipal Name"/></div>
                        <div class="ImportantContactSecondBoxes"><label>VicePrincipal Contact:</label><input type="text" id="VicePrincipalContact" placeholder="Enter VicePrincipal Contact"/></div>
                        <div class="ImportantContactThirdBoxes"><label>VicePrincipal Email:</label><input type="text" id="VicePrincipalEmail" placeholder="Enter VicePrincipal Email"/></div>
                        <div class="ImportantContactFourthBoxes"><label>VicePrincipal Photo:</label><input type="file" id="VicePrincipalPhotoFile" accept=".jpg, .jpeg, .png, .webp, .gif"/><button type="button" id="btnSelectVicePrincipalPhoto" onclick="document.getElementById('VicePrincipalPhotoFile').click()">Choose Photo</button><div id="VicePrincipalPhotoName">No file chosen</div></div>
                    </div>
                    <div class="ImportantContactBoxes" id="contact_Accountant">
                        <div class="ImportantContactFirstBoxes"><label>Accountant Name:</label><input type="text" id="AccountantName" placeholder="Enter Accountant Name"/></div>
                        <div class="ImportantContactSecondBoxes"><label>Accountant Contact:</label><input type="text" id="AccountantContact" placeholder="Enter Accountant Contact"/></div>
                        <div class="ImportantContactThirdBoxes"><label>Accountant Email:</label><input type="text" id="AccountantEmail" placeholder="Enter Accountant Email"/></div>
                        <div class="ImportantContactFourthBoxes"><label>Accountant Photo:</label><input type="file" id="AccountantPhotoFile" accept=".jpg, .jpeg, .png, .webp, .gif"/><button type="button" id="btnSelectAccountantPhoto" onclick="document.getElementById('AccountantPhotoFile').click()">Choose Photo</button><div id="AccountantPhotoName">No file chosen</div></div>
                    </div>
                    <div class="ImportantContactBoxes" id="contact_ExamHead">
                        <div class="ImportantContactFirstBoxes"><label>ExamHead Name:</label><input type="text" id="ExamHeadName" placeholder="Enter ExamHead Name"/></div>
                        <div class="ImportantContactSecondBoxes"><label>ExamHead Contact:</label><input type="text" id="ExamHeadContact" placeholder="Enter ExamHead Contact"/></div>
                        <div class="ImportantContactThirdBoxes"><label>ExamHead Email:</label><input type="text" id="ExamHeadEmail" placeholder="Enter ExamHead Email"/></div>
                        <div class="ImportantContactFourthBoxes"><label>ExamHead Photo:</label><input type="file" id="ExamHeadPhotoFile" accept=".jpg, .jpeg, .png, .webp, .gif"/><button type="button" id="btnSelectExamHeadPhoto" onclick="document.getElementById('ExamHeadPhotoFile').click()">Choose Photo</button><div id="ExamHeadPhotoName">No file chosen</div></div>
                    </div>
                    <div class="ImportantContactBoxes" id="contact_ECAHead">
                        <div class="ImportantContactFirstBoxes"><label>ECAHead Name:</label><input type="text" id="ECAHeadName" placeholder="Enter ECAHead Name"/></div>
                        <div class="ImportantContactSecondBoxes"><label>ECAHead Contact:</label><input type="text" id="ECAHeadContact" placeholder="Enter ECAHead Contact"/></div>
                        <div class="ImportantContactThirdBoxes"><label>ECAHead Email:</label><input type="text" id="ECAHeadEmail" placeholder="Enter ECAHead Email"/></div>
                        <div class="ImportantContactFourthBoxes"><label>ECAHead Photo:</label><input type="file" id="ECAHeadPhotoFile" accept=".jpg, .jpeg, .png, .webp, .gif"/><button type="button" id="btnSelectECAHeadPhoto" onclick="document.getElementById('ECAHeadPhotoFile').click()">Choose Photo</button><div id="ECAHeadPhotoName">No file chosen</div></div>
                    </div>
                </div>
            </div>
            <div id="SocialMediaEditBox">
                <div id="SocialMediaHead">Write Following Social Media Links</div>
                <div id="AboutUsSocialMediaBox">
                    <div class="SocialMediaBoxes"><label>Facebook:</label><input type="text" id="FacebookUrl" placeholder="Enter Facebook URL"/></div>
                    <div class="SocialMediaBoxes"><label>TikTok:</label><input type="text" id="TikTokUrl" placeholder="Enter TikTok URL"/></div>
                    <div class="SocialMediaBoxes"><label>Instagram:</label><input type="text" id="InstagramUrl" placeholder="Enter Instagram URL"/></div>
                    <div class="SocialMediaBoxes"><label>WhatsApp:</label><input type="text" id="WhatsAppUrl" placeholder="Enter WhatsApp URL"/></div>
                    <div class="SocialMediaBoxes"><label>YouTube:</label><input type="text" id="YouTubeUrl" placeholder="Enter YouTube URL"/></div>
                </div>                
            </div>
            <div id="AboutUsLogoSelectBox">
                <label>Select Logo:</label>
                <input type="file" id="SelectLogoFile" accept=".jpg, .jpeg, .png, .webp, .gif"/>
                <button id="btnChooseLogoFile" type="button" onclick="document.getElementById('SelectLogoFile').click()">Choose File</button>
                <div id="AboutUsLogoName"></div>
            </div>

// --- HELPER 1: Client-side Image Resizer ---
function resizeImage(file, targetWidth, targetHeight) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = targetWidth;
                canvas.height = targetHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, targetWidth, targetHeight);
                canvas.toBlob((blob) => {
                    if (blob) resolve(blob);
                    else reject(new Error('Canvas conversion to Blob failed'));
                }, file.type, 0.9);
            };
            img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
    });
}

// --- HELPER 2: Cloudinary Direct Uploader ---
async function uploadToCloudinary(fileBlob, originalFileName, customPublicId) {
    const CLOUD_NAME = 'dcdwpdnyp'; 
    const UPLOAD_PRESET = 'AdminFileUploadPreset';
    const FOLDER_NAME = 'AdminMaterials';          
    
    const formData = new FormData();
    formData.append('file', fileBlob, originalFileName);
    formData.append('upload_preset', UPLOAD_PRESET);
    
    const cleanPublicId = customPublicId.replace(/\.[^/.]+$/, "");
    const fullPublicId = `${FOLDER_NAME}/${cleanPublicId}`;
    formData.append('public_id', fullPublicId); 

    const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
        method: 'POST',
        body: formData
    });

    if (!response.ok) {
        const errData = await response.json();
        throw new Error(errData.error?.message || 'Cloudinary upload failed');
    }

    const data = await response.json();
    const freshUrlWithVersion = `${data.secure_url}?t=${new Date().getTime()}`;
    
    return freshUrlWithVersion; 
}

// --- HELPER 3: Extract Public ID and Call delete-book Edge Function ---
async function deleteOldCloudinaryFile(oldUrl) {
    if (!oldUrl || !oldUrl.includes('/upload/')) return;
    try {
        const cleanUrl = oldUrl.split('?')[0];
        const parts = cleanUrl.split('/upload/');
        const pathAfterUpload = parts[1]; 
        const pathWithoutVersion = pathAfterUpload.replace(/^v\d+\//, '');
        const publicId = pathWithoutVersion.replace(/\.[^/.]+$/, ""); 

        console.log(`Sending Public ID to delete-admin-material Edge Function: "${publicId}"`);

        const { data, error } = await supabaseClient.functions.invoke('delete-admin-material', {
            body: { 
                publicId: publicId, 
                resourceType: "image" 
            }
        });
        
        if (error) {
            console.error("Supabase Edge Function transport layer error:", error);
            return;
        }

        console.log("Cloudinary API execution result:", data);
        
        if (data && data.result === "not found") {
            console.warn("⚠️ Cloudinary could not find that asset. Check API Key/Secret permissions.");
        } else if (data && data.result === "ok") {
            console.log("✨ Successfully wiped the asset from Cloudinary database storage!");
        }

    } catch (e) {
        console.error("Failed to execute old asset cleanup:", e);
    }
}

// --- MAIN FUNCTION: Save Everything ---
async function saveAboutUs() {
    const saveButton = document.getElementById('btnSaveAboutUs');
    saveButton.disabled = true;
    saveButton.textContent = 'Saving Changes...';

    try {
        const fileConfigs = [
            { inputId: 'SelectLogoFile', dbName: 'SchoolLogo', divId: 'AboutUsLogoName', width: 100, height: 100 },
            { inputId: 'PrincipalPhotoFile', dbName: 'PrincipalPhoto', divId: 'PrincipalPhotoName', width: 300, height: 450 },
            { inputId: 'SMCHeadPhotoFile', dbName: 'SMCHeadPhoto', divId: 'SMCHeadPhotoName', width: 300, height: 450 },
            { inputId: 'VicePrincipalPhotoFile', dbName: 'VicePrincipalPhoto', divId: 'VicePrincipalPhotoName', width: 300, height: 450 },
            { inputId: 'AccountantPhotoFile', dbName: 'AccountantPhoto', divId: 'AccountantPhotoName', width: 300, height: 450 },
            { inputId: 'ExamHeadPhotoFile', dbName: 'ExamHeadPhoto', divId: 'ExamHeadPhotoName', width: 300, height: 450 },
            { inputId: 'ECAHeadPhotoFile', dbName: 'ECAHeadPhoto', divId: 'ECAHeadPhotoName', width: 300, height: 450 }
        ];

        for (let i = 1; i <= 10; i++) {
            fileConfigs.push({
                inputId: `selectSlider_${i}`, 
                dbName: `SliderPicture${i}`,
                divId: `SliderPictureName_${i}`,
                width: 1280,
                height: 720
            });
        }

        const updates = [];

        for (const config of fileConfigs) {
            const fileInput = document.getElementById(config.inputId);
            
            if (!fileInput) {
                console.warn(`⚠️ HTML Element with id="${config.inputId}" was NOT found on this page.`);
                continue;
            }

            if (fileInput && fileInput.files && fileInput.files.length > 0) {
                const selectedFile = fileInput.files[0];
                console.log(`🚀 File detected for ${config.dbName}! Name: ${selectedFile.name}, Size: ${selectedFile.size} bytes`);
                
                const { data: oldRecord } = await supabaseClient
                    .from('AboutSchoolTable')
                    .select('Value')
                    .eq('Name', config.dbName)
                    .maybeSingle();

                if (oldRecord && oldRecord.Value) {
                    console.log(`Found old URL to remove: ${oldRecord.Value}`);
                    await deleteOldCloudinaryFile(oldRecord.Value);
                }
                
                console.log(`Resizing ${selectedFile.name} to ${config.width}x${config.height}...`);
                const resizedBlob = await resizeImage(selectedFile, config.width, config.height);
                
                console.log(`Uploading resized blob to Cloudinary using preset: AdminFileUploadPreset...`);
                const cloudinaryUrl = await uploadToCloudinary(resizedBlob, selectedFile.name, config.divId);
                console.log(`✅ Cloudinary upload successful! New URL: ${cloudinaryUrl}`);
                
                updates.push({
                    Name: config.dbName,
                    Value: cloudinaryUrl,
                    FileName: selectedFile.name
                });
            }
        }

        // 2. Collect Standard Text Inputs
        const textFields = ['SchoolName', 'SchoolAddress', 'SchoolContact', 'SchoolEmail', 'SchoolWebsite'];
        textFields.forEach(id => {
            const element = document.getElementById(id);
            if (element) {
                updates.push({ Name: id, Value: element.value, FileName: null });
            }
        });

        // 2.5 Collect Special Contacts Text Fields (Names, Mobiles, Emails)
        const staffRoles = ['Principal', 'SMCHead', 'VicePrincipal', 'Accountant', 'ExamHead', 'ECAHead'];
        const metadataTypes = ['Name', 'Contact', 'Email'];

        staffRoles.forEach(role => {
            metadataTypes.forEach(type => {
                const inputId = `${role}${type}`;
                const element = document.getElementById(inputId);
                if (element) {
                    updates.push({
                        Name: inputId,
                        Value: element.value,
                        FileName: null
                    });
                } else {
                    console.warn(`⚠️ Expected metadata input id="${inputId}" was not found in the HTML.`);
                }
            });
        });

        // 3. Collect Slider Credentials
        for (let i = 1; i <= 10; i++) {
            const credentialInput = document.getElementById(`SliderCredential${i}`);
            if (credentialInput) {
                updates.push({
                    Name: `SliderCredential${i}`,
                    Value: credentialInput.value,
                    FileName: null
                });
            }
        }

        // 4. Collect Social Media URLs
        const socialMediaPlatforms = ['Facebook', 'TikTok', 'Instagram', 'WhatsApp', 'YouTube'];
        socialMediaPlatforms.forEach(platform => {
            const mediaInput = document.getElementById(`${platform}Url`);
            if (mediaInput) {
                updates.push({
                    Name: `${platform}Url`,
                    Value: mediaInput.value,
                    FileName: null
                });
            }
        });        

        // 5. Save everything to Supabase via Upsert
        console.log("Final payload compilation about to write to Supabase:", updates);
        for (const rowData of updates) {
            if (rowData.Name === 'SchoolLogo') {
                console.log("Sending this exact record to Supabase for SchoolLogo:", rowData);
            }
            const { error } = await supabaseClient
                .from('AboutSchoolTable')
                .upsert(rowData, { onConflict: 'Name' });
            if (error) {
                console.error(`❌ Error upserting row ${rowData.Name}:`, error.message);
                throw error;
            }
        }
        alert('All updates, credentials, and files saved successfully!');        
    } catch (error) {
        console.error('Error saving page modifications:', error);
        alert(`Failed to save details: ${error.message}`);
    } finally {
        saveButton.disabled = false;
        saveButton.textContent = 'Save Changes';
    }
}
