<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Change Password</title>
        <link id="dynamicFavicon" rel="icon" type="image/png" href="" />
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="../SupabaseConfig.js"></script>
        <style>
            body{
                font-family:Arial;
                background:#f4f4f4;
                margin:0;
                padding:20px;
                display:none
            }
            .box{
                max-width:420px;
                margin:auto;
                background:#fff;
                padding:20px;
                border-radius:10px;
                box-shadow:0 0 10px rgba(0,0,0,.2)
            }
            body { 
                width: 100%;
                max-width: 1200px;   
                font-family: Arial, sans-serif; 
                min-height: 100%;
                font-family: 'Arial', 'MySanskritFont', sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;  
            }

            #PageNaviggationBox {
                width: 100%;
                display: flex;
                flex-direction: row;
                justify-content: space-evenly;
                background: #000000;
                padding: 1rem;
                text-align: center;
            }
            #LogoBox{
                width: 6%;
                height: auto;     
            }
            #LogoBox img{
                width: 100%;
                height: 100%;
                object-fit: contain;
            }
            #PageNavigationSelect{
                width: 80%;
                font-size: 2vw;
                font-weight: bold;
                padding: 2vh;
                border: 4px solid #000000;
            }
            h2{
                text-align:center
            }
            .group{
                margin-bottom:15px;
                position:relative
            }
            label{
                font-weight:bold
            }
            input{
                width:100%;
                padding:10px;
                margin-top:5px;                
                border:1px solid #ccc;
                border-radius:5px
            }
            button{
                width:100%;
                padding:10px;
                border:none;
                background:#007bff;
                color:#fff;
                font-size:16px;
                border-radius:5px;
                cursor:pointer
            }
            .toggle{
                position:absolute;
                right:10px;
                top:35px;
                cursor:pointer
            }
            #msg{
                text-align:center;
                margin-top:10px;
                font-weight:bold
            }
            .bar{
                height:6px;
                background:#ddd;
                border-radius:5px;
                margin-top:5px;
                overflow:hidden
            }
            .fill{
                height:100%;
                width:0%;
                background:red;
                transition:.3s
            }
            .small{
                font-size:12px;
                margin-top:5px
            }
        </style>
    </head>
    <body>
        <div id="PageNaviggationBox">
            <div id="LogoBox"><img src="" alt="Logo" width="100" height="100"></div>
            <select id="PageNavigationSelect">   
                <option value="AdminPage">Admin</option>
                <option value="LibraryPage">Library</option>
                <option value="NoticePage">Notice</option>
                <option value="QuestionBankPage">Question Bank</option>
                <option value="StudentPage">Students</option>
                <option value="TeacherPage">Teachers</option>
                <option value="BalPratibhaPage">Bal Pratibha</option>
                <option value="AboutUsPage">About Us</option>
                <option value="GalleryPage">Gallery</option>
                <option value="SMC_TGC_Page">SMC & TGC</option>
                <option value="HelpingHandPage">Helping Hand</option>
                <option value="HomePage">Home</option>
            </select>
        </div>
        <div class="box">
            <h2>Change Password</h2>
            <form id="form">
                <div class="group">
                    <label>New Password</label>
                    <input type="password" id="newPassword">
                    <div class="bar"><div class="fill" id="bar"></div></div>
                    <div class="small" id="strengthText"></div>
                </div>
                <div class="group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirmPassword">
                    <div class="small" id="matchText"></div>
                </div>
                <button id="btn" type="submit">Update Password</button>
            </form>
            <div id="msg"></div>
        </div>
        <script>
            const form=document.getElementById("form");
            const msg=document.getElementById("msg");
            const btn=document.getElementById("btn");
            const p1=document.getElementById("newPassword");
            const p2=document.getElementById("confirmPassword");
            const bar=document.getElementById("bar");
            const strengthText=document.getElementById("strengthText");
            const matchText=document.getElementById("matchText");
            function show(t,c){
                msg.innerText=t;
                msg.style.color=c;
            }

            /* ================= SESSION CHECK ================= */
            async function checkSession(){
                const {data:{session}}=await supabaseClient.auth.getSession();
                if(!session) window.location.replace("LoginIndex.html");
                else document.body.style.display="block";
            }
            checkSession();

            /* ================= PASSWORD STRENGTH ================= */
            function strength(val){
                let s=0;
                if(val.length>=8)s++;
                if(/[A-Z]/.test(val))s++;
                if(/[a-z]/.test(val))s++;
                if(/[0-9]/.test(val))s++;
                if(/[^A-Za-z0-9]/.test(val))s++;
                return s;
            }
            p1.addEventListener("input",()=>{
                const s=strength(p1.value);
                const percent=(s/5)*100;
                bar.style.width=percent+"%";
                bar.style.background=
                percent<40?"red":
                percent<80?"orange":"green";
                strengthText.innerText="Strength: "+s+"/5";
                checkMatch();
            });

            /* ================= PASSWORD MATCH ================= */
            function checkMatch(){
                if(p2.value.length===0){
                matchText.innerText="";
                return;
                }

                if(p1.value===p2.value){
                    matchText.innerText="✓ Passwords match";
                    matchText.style.color="green";
                }else{
                    matchText.innerText="✗ Passwords do not match";
                    matchText.style.color="red";
                }
            }
            p2.addEventListener("input",checkMatch);

            /* ================= SUBMIT ================= */
            form.onsubmit=async(e)=>{
                e.preventDefault();
                const pass1=p1.value.trim();
                const pass2=p2.value.trim();
                if(pass1!==pass2){
                    show("Passwords do not match","red");
                    return;
                }
                if(strength(pass1)<4){
                    show("Weak password","red");
                    return;
                }
                btn.innerText="Updating...";
                btn.disabled=true;
                try{
                    const {error}=await supabaseClient.auth.updateUser({
                    password:pass1
                    });
                    if(error) throw error;
                    show("Password updated successfully","green");
                    setTimeout(async()=>{
                        await supabaseClient.auth.signOut();
                        window.location.replace("LoginIndex.html");
                    },2000);
                }catch(err){
                    show(err.message,"red");
                    btn.innerText="Update Password";
                    btn.disabled=false;
                }
            };

            // -------------------- NAVIGATE PAGES --------------------
            const PageNavigationDripDown = document.getElementById("PageNavigationSelect");
            PageNavigationDripDown.addEventListener("change", function () {
                const pageMap = {
                    "AdminPage": "LogInIndex.html",
                    "LibraryPage": "../LibraryPage/LibraryIndex.html",
                    "NoticePage": "../NoticePage/NoticeIndex.html",
                    "QuestionBankPage": "../QuestionBankPage/QuestionBankIndex.html",
                    "StudentPage": "../StudentPage/StudentIndex.html",
                    "TeacherPage": "../TeacherPage/TeacherIndex.html",
                    "BalPratibhaPage": "../BalPratibhaPage/BalPratibhaIndex.html",
                    "AboutUsPage": "../AboutUsPage/AboutUsIndex.html",
                    "GalleryPage": "../GalleryPage/GalleryIndex.html",
                    "SMC_TGC_Page": "../SMC_TGC_Page/SMC_TGC_Index.html",
                    "HelpingHandPage": "../HelpingHandPage/HelpingHandIndex.html",
                    "HomePage": "../index.html"
                };

                const selectedPage = pageMap[this.value];
                if (selectedPage) {
                    window.location.href = selectedPage;
                }
            });

            //Dynamically show logo and favicon
            async function loadDynamicLogoAndFavicon() {
                try {
                    // Query the table natively using your pre-configured supabaseClient
                    const { data, error } = await supabaseClient
                        .from('AboutSchoolTable')
                        .select('Value')
                        .eq('Name', 'SchoolLogo')
                        .single();

                    if (error) {
                        console.error("Supabase query error loading branding:", error.message);
                        return;
                    }

                    if (data && data.Value) {
                        const freshLogoUrl = data.Value;

                        // 1. Update the Favicon inside the Document Head
                        const faviconElement = document.getElementById('dynamicFavicon');
                        if (faviconElement) {
                            faviconElement.href = freshLogoUrl;
                        }

                        // 2. Update the Logo Image Source inside #LogoBox
                        const logoImgElement = document.querySelector('#LogoBox img');
                        if (logoImgElement) {
                            logoImgElement.src = freshLogoUrl;
                        }
                        
                        console.log("Logo and Favicon synced dynamically via supabaseClient!");
                    }
                } catch (error) {
                    console.error("Unexpected error setting up branding layout:", error);
                }
            }
            document.addEventListener('DOMContentLoaded', loadDynamicLogoAndFavicon);

        </script>
    </body>
</html>
