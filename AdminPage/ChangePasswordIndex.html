<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Change Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../SupabaseConfig.js"></script>

<style>
body{font-family:Arial;background:#f4f4f4;margin:0;padding:20px;display:none}
.box{max-width:420px;margin:auto;background:#fff;padding:20px;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,.2)}
h2{text-align:center}
.group{margin-bottom:15px;position:relative}
label{font-weight:bold}
input{width:100%;padding:10px;margin-top:5px;border:1px solid #ccc;border-radius:5px}
button{width:100%;padding:10px;border:none;background:#007bff;color:#fff;font-size:16px;border-radius:5px;cursor:pointer}
.toggle{position:absolute;right:10px;top:35px;cursor:pointer}

#msg{text-align:center;margin-top:10px;font-weight:bold}

.bar{height:6px;background:#ddd;border-radius:5px;margin-top:5px;overflow:hidden}
.fill{height:100%;width:0%;background:red;transition:.3s}

.small{font-size:12px;margin-top:5px}
</style>
</head>

<body>

<div class="box">
<h2>Change Password</h2>

<form id="form">

<div class="group">
<label>New Password</label>
<input type="password" id="newPassword">
<div class="bar"><div class="fill" id="bar"></div></div>
<div class="small" id="strengthText"></div>
</div>

<div class="group">
<label>Confirm Password</label>
<input type="password" id="confirmPassword">
<div class="small" id="matchText"></div>
</div>

<button id="btn" type="submit">Update Password</button>
</form>

<div id="msg"></div>
</div>

<script>
const supabaseClient=supabase.createClient(_supabaseUrl,_supabaseKey);

const form=document.getElementById("form");
const msg=document.getElementById("msg");
const btn=document.getElementById("btn");

const p1=document.getElementById("newPassword");
const p2=document.getElementById("confirmPassword");

const bar=document.getElementById("bar");
const strengthText=document.getElementById("strengthText");
const matchText=document.getElementById("matchText");

function show(t,c){
msg.innerText=t;
msg.style.color=c;
}

/* ================= SESSION CHECK ================= */
async function checkSession(){
const {data:{session}}=await supabaseClient.auth.getSession();
if(!session) window.location.replace("LoginIndex.html");
else document.body.style.display="block";
}
checkSession();

/* ================= PASSWORD STRENGTH ================= */
function strength(val){
let s=0;
if(val.length>=8)s++;
if(/[A-Z]/.test(val))s++;
if(/[a-z]/.test(val))s++;
if(/[0-9]/.test(val))s++;
if(/[^A-Za-z0-9]/.test(val))s++;
return s;
}

p1.addEventListener("input",()=>{
const s=strength(p1.value);
const percent=(s/5)*100;

bar.style.width=percent+"%";
bar.style.background=
percent<40?"red":
percent<80?"orange":"green";

strengthText.innerText="Strength: "+s+"/5";

/* also update match live */
checkMatch();
});

/* ================= PASSWORD MATCH ================= */
function checkMatch(){
if(p2.value.length===0){
matchText.innerText="";
return;
}

if(p1.value===p2.value){
matchText.innerText="✓ Passwords match";
matchText.style.color="green";
}else{
matchText.innerText="✗ Passwords do not match";
matchText.style.color="red";
}
}

p2.addEventListener("input",checkMatch);

/* ================= SUBMIT ================= */
form.onsubmit=async(e)=>{
e.preventDefault();

const pass1=p1.value.trim();
const pass2=p2.value.trim();

if(pass1!==pass2){
show("Passwords do not match","red");
return;
}

if(strength(pass1)<4){
show("Weak password","red");
return;
}

/* LOADING STATE */
btn.innerText="Updating...";
btn.disabled=true;

try{
const {error}=await supabaseClient.auth.updateUser({
password:pass1
});

if(error) throw error;

show("Password updated successfully","green");

setTimeout(async()=>{
await supabaseClient.auth.signOut();
window.location.replace("LoginIndex.html");
},2000);

}catch(err){
show(err.message,"red");
btn.innerText="Update Password";
btn.disabled=false;
}
};
</script>

</body>
</html>
