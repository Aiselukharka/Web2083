<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link
        rel="icon"
        type="image/x-icon"
        href="https://res.cloudinary.com/dfsaihbk7/image/upload/v1779451142/satakon_h6cojj.png">
    <style>
        *{margin:0; padding:0; box-sizing:border-box;}
        body{
            width: 100%;
            height:100vh;
            background-color: #555555;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #MainBody{
            width: 96%;
            height: auto;
            min-height: 100vh;
            background-color: #ffcccc;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #HeadBox{
            width: 100%;
            height: auto;
            background-color: #111111;
            min-height: 10vh;
            color: #ffffff;
            font-size: 4vh;
            font-weight: bold;
            display: flex;
            flex-direction: row;
            text-align: center;    
            align-items: center;
            padding: 2vh 0 2vh 0;
        }
        #LeftColumn{width: 20%; display: flex; flex-direction: row;}
        #CenterColumn{width: 60%;}
        #RightColumn{width: 20%;}
        #LeftColumn button{
            width: 50%;
            height: auto;
            padding: 1vh;
            background-color: transparent;
            color: #00ff00;
            font-weight: bold;
            font-size: 6vh;
        }
        #LeftColumn button:hover{font-size: 8vh;}
        /* Styles for login container */
        #LogInBox {
            width: 60%;
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 2vh 2vh 4vh #333;
            text-align: center;
            margin: 4vh 0 0 0;
        }

        #LogInBox h2 {
            width: 100%;; 
            text-align: center;
            padding: 2vh;
            color: #00a; 
            font-size: 4vh;
            font-weight: bold; 
            text-shadow: 1px 1px 1px #333;    
            }
        #LogInBox p {
            width: 100%;
            padding: 1vh;
            color: #333;
            font-size: 3vh;
            font-style: italic; 
            }

        .InputGroups {
            width: 100%;
            padding: 2vh;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-evenly;
        }

        .InputGroups label {
            width: 30%;
            font-size: 4vh;
            text-align: left;
            padding: 2vh 0 2vh 0;
        }

        .InputGroups input {width: 50%; font-size: 4vh; padding: 2vh 0 2vh 0;}
        /* Fixed toggle button styling - perfectly centered */
        .InputGroups button {
            width: 10%;
            height: auto;
            padding: 2vh 0 2vh 0;
            border: none;
        }
        #Email{width: 60%;}

        #btnReset {
            width: 50%;
            padding: 2vh;
            background: linear-gradient(180deg, #090, #0a0, #090);
            color: white;
            border-radius: 4vh;
            cursor: pointer;
            font-size: 4vh;
            font-weight: bold;
        }
        #btnReset:hover {background: linear-gradient(180deg, #060, #090, #060);color: #ffff00; }
        /* Style for disabled submit button */
        #btnReset:disabled {background: #cccccc; cursor: not-allowed;}
        .InputGroups input:focus {outline: none; border-color: #0000aa; box-shadow: 0 0 5px rgba(0,0,170,0.2);}
    </style>
</head>

<body>

    <div id="MainBody">

        <div id="HeadBox">

            <div id="LeftColumn">
                <button
                    type="button"
                    onclick="location.href='../LoginPage/LoginIndex.html'">
                    &#8592
                </button>

                <img
                    src="https://res.cloudinary.com/dfsaihbk7/image/upload/v1779451142/satakon_h6cojj.png"
                    width="80">
            </div>

            <div id="CenterColumn">
                Reset Password
            </div>

            <div id="RightColumn"></div>

        </div>

        <div id="LogInBox">

            <h2>Set New Password</h2>

            <p>
                Please enter a strong password with at least
                8 characters including uppercase, lowercase,
                special characters and numbers.
            </p>

            <form id="updatePasswordForm">

                <div class="InputGroups">
                    <label for="newPassword">New Password</label>

                    <input
                        type="password"
                        id="newPassword"
                        required
                        placeholder="••••••••">

                    <button
                        type="button"
                        id="toggleNewPassword">
                        👁️
                    </button>
                </div>

                <div class="InputGroups">
                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        required
                        placeholder="••••••••">

                    <button
                        type="button"
                        id="toggleConfirmPassword">
                        👁️
                    </button>
                </div>

                <button
                    type="submit"
                    id="btnReset">
                    Confirm
                </button>

            </form>

            <div
                id="updateMessage"
                style="margin-top:15px;font-size:14px;display:none;">
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../SupabaseConfig.js"></script>
    <script>
        const supabaseClient = supabase.createClient(_supabaseUrl, _supabaseKey);
        const updateForm = document.getElementById('updatePasswordForm');
        const updateMessage = document.getElementById('updateMessage');
        const updateBtn = document.getElementById('btnReset');
        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');

        let isRecoverySession = false;
        supabaseClient.auth.onAuthStateChange(
            (event) => {

                if (event === "PASSWORD_RECOVERY") {

                    isRecoverySession = true;
                }
            }
        );
        setTimeout(() => {
            if (!isRecoverySession) {
                alert(
                    "Invalid password recovery session."
                );
                window.location.replace(
                    "LoginIndex.html"
                );
            }
        }, 500);

        // ======================================================
        // Initialize Reset Password Page
        // ======================================================

        async function initializePasswordPage() {

            // Wait for Supabase to process recovery token
            const { data, error } =
                await supabaseClient.auth.getSession();

            // If session exists → OK
            if (data?.session) {
                return;
            }

            // If NOT, wait a bit and retry ONCE
            setTimeout(async () => {

                const { data: retryData } =
                    await supabaseClient.auth.getSession();

                if (!retryData?.session) {

                    showMessage(
                        "Invalid or expired reset link. Redirecting...",
                        "red"
                    );

                    setTimeout(() => {
                        window.location.href = "LoginIndex.html";
                    }, 2000);
                }

            }, 1500);
        }

        initializePasswordPage();

        // ======================================================
        // FORM SUBMIT
        // ======================================================

        updateForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const newPassword = newPasswordInput.value.trim();
            const confirmPassword = confirmPasswordInput.value.trim();

            if (newPassword !== confirmPassword) {
                showMessage("Passwords do not match!", "red");
                return;
            }

            const passwordRegex =
                /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z\d]).{8,}$/;

            if (!passwordRegex.test(newPassword)) {
                showMessage("Weak password.", "red");
                return;
            }

            updateBtn.innerText = "Updating...";
            updateBtn.disabled = true;

            try {
                const { data: { session } } =
                    await supabaseClient.auth.getSession();

                if (!session) {
                    throw new Error("Session expired. Please request reset again.");
                }

                const { error } =
                    await supabaseClient.auth.updateUser({
                        password: newPassword
                    });

                if (error) throw error;

                showMessage("Password updated successfully!", "green");

                setTimeout(() => {
                    window.location.href = "LoginIndex.html";
                }, 3000);

            } catch (err) {
                console.error(err);
                showMessage(err.message, "red");

                updateBtn.innerText = "Confirm";
                updateBtn.disabled = false;
            }
        });

        // ======================================================
        // SHOW MESSAGE
        // ======================================================

        function showMessage(text, color) {
            updateMessage.innerText = text;
            updateMessage.style.color = color;
            updateMessage.style.display = "block";
        }

        // ======================================================
        // TOGGLE PASSWORD
        // ======================================================

        document.getElementById('toggleNewPassword')
        .addEventListener('click', function () {
            const type =
                newPasswordInput.type === 'password'
                    ? 'text'
                    : 'password';

            newPasswordInput.type = type;
            this.textContent = type === 'password' ? '👁️' : '🙈';
        });

        document.getElementById('toggleConfirmPassword')
        .addEventListener('click', function () {
            const type =
                confirmPasswordInput.type === 'password'
                    ? 'text'
                    : 'password';

            confirmPasswordInput.type = type;
            this.textContent = type === 'password' ? '👁️' : '🙈';
        });

        // ======================================================
        // PASSWORD STRENGTH
        // ======================================================

        function checkPasswordStrength(password) {
            let strength = 0;

            if (password.length >= 8) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;

            return strength;
        }

        // ======================================================
        // STRENGTH METER
        // ======================================================

        function addStrengthMeter() {
            const meter = `
                <div id="strengthMeter" style="margin-top:10px;">
                    <div style="width:100%;height:5px;background:#ddd;">
                        <div id="strengthBar"
                            style="width:0%;height:100%;background:red;">
                        </div>
                    </div>
                    <div id="strengthText"
                        style="font-size:12px;margin-top:5px;">
                    </div>
                </div>
            `;

            const group = newPasswordInput.closest('.InputGroups');
            group.insertAdjacentHTML('afterend', meter);
        }

        addStrengthMeter();

        // ======================================================
        // UPDATE STRENGTH + MATCH
        // ======================================================

        function updateStrengthMeter() {
            const password = newPasswordInput.value;
            const strength = checkPasswordStrength(password);

            const bar = document.getElementById('strengthBar');
            const text = document.getElementById('strengthText');

            const percent = (strength / 5) * 100;

            bar.style.width = percent + "%";
            bar.style.background =
                percent < 40 ? "red" :
                percent < 80 ? "orange" :
                "green";

            text.innerText = `Strength: ${strength}/5`;
        }

        function checkPasswordMatch() {
            const msg = document.getElementById('matchMessage') ||
                document.createElement('div');

            msg.id = 'matchMessage';

            const group = confirmPasswordInput.closest('.InputGroups');
            group.insertAdjacentElement('afterend', msg);

            if (!confirmPasswordInput.value) {
                msg.innerHTML = '';
                return;
            }

            if (newPasswordInput.value === confirmPasswordInput.value) {
                msg.innerHTML = '✓ Passwords match';
                msg.style.color = 'green';
            } else {
                msg.innerHTML = '✗ Passwords do not match';
                msg.style.color = 'red';
            }
        }

        // ======================================================
        // EVENTS
        // ======================================================

        newPasswordInput.addEventListener('input', () => {
            updateStrengthMeter();
            checkPasswordMatch();
        });

        confirmPasswordInput.addEventListener('input', checkPasswordMatch);

    </script>

</body>
</html>
