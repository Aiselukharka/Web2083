<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<link rel="icon" href="https://res.cloudinary.com/dfsaihbk7/image/upload/v1779451142/satakon_h6cojj.png">

<style>
@font-face{font-family:'MySanskritFont';src:url('../Sanskrit-2003.ttf') format('truetype');}
*{margin:0;padding:0;box-sizing:border-box;}
html{width:100%;min-height:100%;display:flex;justify-content:center;}
body{width:100%;max-width:1200px;min-height:100vh;font-family:Arial,'MySanskritFont',sans-serif;display:flex;justify-content:center;}
#MainBody{width:96%;max-width:1100px;min-height:100vh;background:#ffaaaa;display:flex;flex-direction:column;align-items:center;}
#PageNaviggationBox {width: 100%; display: flex; flex-direction: row; justify-content: space-evenly; background: #000000; padding: 1rem; text-align: center;}
#LogoBox{width: 6%; height: auto;}
#LogoBox img{width: 100%; height: 100%; object-fit: contain;}
#PageNavigationSelect{width: 40%; font-size: 2vw; font-weight: bold; padding: 2vh; border: 4px solid #000000;}
#PageNaviggationBox button{width: 20%; padding: 2vh 0 2vh 0; background: linear-gradient(180deg, #00aa00, #00cc00, #00aa00); color: #ffffff; border-radius: 4vw; font-size: 2vw; font-weight: bold; cursor: pointer;}
#pageNaviggationBox button:hover{background: linear-gradient(180deg, #009900, #00aa00, #009900); color: #ffff00;}
#btnAdmin{background:#00aa00!important;}
.LogInContainer{width:60%;padding:2rem;background:linear-gradient(135deg,#aaccaa,#aaeeaa);display:flex;justify-content:center;}
.LogInBox{width:100%;display:flex;flex-direction:column;align-items:center;}
.LogInBox h2{font-size:2.5rem;color:#003300;margin-bottom:10px;}
.LogInBox p{font-size:1.2rem;color:#555;margin-bottom:20px;}
#loginStatus{font-size:1.1rem;font-weight:bold;margin-bottom:20px;text-align:center;}
#loginForm{width:100%;display:flex;flex-direction:column;align-items:center;background:linear-gradient(135deg,#ddd,#eee);padding:2rem;border-radius:10px;}
.InputGroup{width:100%;display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;font-size:1.3rem;font-weight:bold;}
.InputGroup label{width:25%;}
#email,#password{width:100%;padding:.7rem;font-size:1.1rem;border:1px solid #ccc;border-radius:5px;}
#PasswordBox{width:75%;position:relative;}
#togglePassword{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1.2rem;}
#btnLogIn,#btnOpenAdmin{width:50%;padding:.8rem;margin-top:15px;font-size:1.2rem;color:white;border:none;border-radius:20px;cursor:pointer;}
#btnLogIn{background:linear-gradient(180deg,#007700,#00aa00,#007700);}
#btnOpenAdmin{background:linear-gradient(180deg,#0000aa,#3333ff,#0000aa);display:none;}
#forgotPassword{margin-top:1rem;font-size:1.2rem;color:#0000dd;text-decoration:none;}
#forgotPassword:hover{text-decoration:underline;}
#errorMessage{color:red;margin-top:15px;font-size:14px;display:none;}

@media(max-width:800px){
.LogInContainer{width:90%;}
.InputGroup{flex-direction:column;align-items:flex-start;}
.InputGroup label{width:100%;}
#PasswordBox{width:100%;}
#btnLogIn,#btnOpenAdmin{width:80%;}
#NavigationBox a{width:auto;padding:8px 12px;font-size:.9rem;}
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
<div id="MainBody">
<div id="PageNaviggationBox">
    <div id="LogoBox"><img src="https://res.cloudinary.com/dfsaihbk7/image/upload/v1779451142/satakon_h6cojj.png" alt="Logo" width="100" height="100"></div>
    <select id="PageNavigationSelect">   
        <option value="AdminPage">Admin</option>
        <option value="HelpingHandPage">Helping Hands</option>
        <option value="StudentPage">Students</option>
        <option value="QuestionBankPage">Question Bank</option>
        <option value="NoticePage">Notice</option>
        <option value="LibraryPage">Library</option>
        <option value="TeacherPage">Teachers</option>
        <option value="HomePage">Home</option>
        <option value="BalPratibhaPage">Bal Pratibha</option>
        <option value="AboutUsPage">About Us</option>
        <option value="GalleryPage">Gallery</option>
        <option value="SMC_TGC_Page">SMC & TGC</option>                        
    </select>
    <button id="btnEnglish" type="button" onclick="changeLanguage('en')">English</button>
    <button id="btnNepali" type="button" onclick="changeLanguage('ne')">नेपाली</button>
</div>

<div class="LogInContainer">
<div class="LogInBox">

<h2>Admin Login</h2>
<p>Enter credentials to access dashboard</p>

<div id="loginStatus"></div>

<form id="loginForm" autocomplete="off">
<div class="InputGroup">
<label>Email</label>
<input type="email" id="email" autocomplete="off" required>
</div>

<div class="InputGroup">
<label>Password</label>
<div id="PasswordBox">
<input type="password" id="password" autocomplete="new-password" required>
<button type="button" id="togglePassword">👁️</button>
</div>
</div>

<button type="submit" id="btnLogIn">Sign In</button>
</form>

<button id="btnOpenAdmin">Open Admin Panel</button>
<a href="#" id="forgotPassword">Forgot Password?</a>
<div id="errorMessage"></div>

</div>
</div>

</div>

<script src="../SupabaseConfig.js"></script>

<script>
const supabaseClient = supabase.createClient(_supabaseUrl,_supabaseKey);

const loginForm=document.getElementById("loginForm");
const loginBtn=document.getElementById("btnLogIn");
const openAdminBtn=document.getElementById("btnOpenAdmin");
const errorMessage=document.getElementById("errorMessage");
const loginStatus=document.getElementById("loginStatus");
const togglePassword=document.getElementById("togglePassword");
const passwordInput=document.getElementById("password");
const adminBtn=document.getElementById("btnOpenAdmin");
const forgotPasswordBtn=document.getElementById("forgotPassword");

// -------------------- NAVIGATE PAGES --------------------
const PageNavigationDripDown = document.getElementById("PageNavigationSelect");
PageNavigationDripDown.addEventListener("change", function () {
    const pageMap = {
        "AdminPage": "LogInIndex.html",
        "LibraryPage": "../LibraryPage/LibraryIndex.html",
        "NoticePage": "../NoticePage/NoticeIndex.html",
        "QuestionBankPage": "../QuestionBankPage/QuestionBankIndex.html",
        "StudentPage": "../StudentPage/StudentIndex.html",
        "TeacherPage": "../TeacherPage/TeacherIndex.html",
        "BalPratibhaPage": "../BalPratibhaPage/BalPratibhaIndex.html",
        "AboutUsPage": "../AboutUsPage/AboutUsIndex.html",
        "GalleryPage": "../GalleryPage/GalleryIndex.html",
        "SMC_TGC_Page": "../SMC_TGC_Page/SMC_TGC_Index.html",
        "HelpingHandPage": "../HelpingHandPage/HelpingHandIndex.html",
        "HomePage": "../index.html"
    };
    const selectedPage = pageMap[this.value];
    if (selectedPage) {
        window.location.href = selectedPage;
    }
});

window.addEventListener("load", async () => {
    const { data } = await supabaseClient.auth.getSession();

    if (data.session) {
        // already logged in → skip login page
        window.location.replace("AdminIndex.html");
        return;
    }

    // otherwise continue normal login UI
    refreshUI();
});

function showError(msg){
errorMessage.innerText=msg;
errorMessage.style.display="block";
}

function setLoading(state){
loginBtn.disabled=state;
loginBtn.innerText=state ? "Authenticating..." : "Sign In";
if(state) errorMessage.style.display="none";
}

async function refreshUI(){
const {data,error}=await supabaseClient.auth.getSession();
if(error){
console.error(error);
return;
}

if(data.session){
loginStatus.innerText="✅ Admin logged in";
loginStatus.style.color="green";
openAdminBtn.style.display="block";
loginBtn.style.display="none";
adminBtn.innerText="Admin";
}else{
loginStatus.innerText="❌ Admin not logged in";
loginStatus.style.color="red";
openAdminBtn.style.display="none";
loginBtn.style.display="block";
adminBtn.innerText="Login";
loginForm.reset();
passwordInput.type="password";
togglePassword.innerText="👁️";
}
}

togglePassword.onclick=()=>{
passwordInput.type=passwordInput.type==="password"?"text":"password";
togglePassword.innerText=passwordInput.type==="password"?"👁️":"🙈";
};

loginForm.addEventListener("submit",async(e)=>{
e.preventDefault();
setLoading(true);

const email=document.getElementById("email").value.trim();
const password=passwordInput.value;

try{
const {data,error}=await supabaseClient.auth.signInWithPassword({
email,
password
});

if(error) throw error;

// IMPORTANT: force session refresh
const {data:sessionData}=await supabaseClient.auth.getSession();

if(!sessionData.session){
throw new Error("Login failed. Session not created.");
}

// SUCCESS → update UI FIRST
await refreshUI();

alert("Login successful");

// redirect AFTER UI reset
window.location.href="AdminIndex.html";

}catch(err){
console.error(err);
showError(err.message || "Login failed");
setLoading(false);
}
});

openAdminBtn.onclick=()=>location.href="AdminIndex.html";

forgotPasswordBtn.onclick = async (e) => {

    e.preventDefault();

    const email = prompt("Enter email");

    if (!email) return;

    setLoading(true);

    try {

        // Generate Supabase recovery link

        const linkResponse = await fetch(
            "https://wrjivuysumgpoqmabwpw.supabase.co/functions/v1/generate-reset-link",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ email })
            }
        );

        const linkResult = await linkResponse.json();

        if (!linkResponse.ok) {
            throw new Error(linkResult.error);
        }

        // Send email via Resend

        const emailResponse = await fetch(
            "https://wrjivuysumgpoqmabwpw.supabase.co/functions/v1/send-reset-email",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    to: email,
                    resetLink: linkResult.resetLink
                })
            }
        );

        
        const emailResult = await emailResponse.json();

        console.log("Email Result:", JSON.stringify(emailResult, null, 2));
        alert(JSON.stringify(emailResult, null, 2));

        if (!emailResponse.ok) {
            alert(JSON.stringify(emailResult, null, 2));
            throw new Error(emailResult.error);
        }

        alert("Password reset email sent.");

    } catch (err) {

        console.error(err);
        alert(err.message);

    } finally {

        setLoading(false);

    }

};

window.addEventListener("load",refreshUI);

supabaseClient.auth.onAuthStateChange((event)=>{
if(event==="SIGNED_IN"){
refreshUI();
}
if(event==="SIGNED_OUT"){
refreshUI();
}
});

</script>

</body>
</html>
