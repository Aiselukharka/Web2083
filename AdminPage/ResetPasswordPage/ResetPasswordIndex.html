<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link id="dynamicFavicon" rel="icon" type="image/png" href="" />
    <link rel="stylesheet" href="ResetPasswordStyle.css"/>
</head>
<body>
    <div id="MainBody">
        <div id="HeadBox">
            <div id="LeftColumn">
                <button type="button" onclick="location.href='../LoginPage/LoginIndex.html'">&#8592</button>
                <div id="LogoBox"><img src="" width="80" height="80"></div>
            </div>
            <div id="CenterColumn">Reset Password</div>
            <div id="RightColumn"></div>
        </div>
        <div id="LogInBox">
            <h2>Set New Password</h2>
            <p>
                Please enter a strong password with at least
                8 characters including uppercase, lowercase,
                special characters and numbers.
            </p>
            <form id="updatePasswordForm">
                <div class="InputGroups">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" required placeholder="••••••••">
                    <button type="button" id="toggleNewPassword">👁️</button>
                </div>
                <div class="InputGroups">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" required placeholder="••••••••">
                    <button type="button" id="toggleConfirmPassword">👁️</button>
                </div>
                <button type="submit" id="btnReset">Confirm</button>
            </form>
            <div id="updateMessage" style="margin-top:15px;font-size:14px;display:none;"></div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../SupabaseConfig.js"></script>
    <script src="ResetPasswordScript.js"></script>
</body>
</html>
