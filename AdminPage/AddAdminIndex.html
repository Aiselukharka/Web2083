<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Add Admin</title>
<link id="dynamicFavicon" rel="icon" type="image/png" href="" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="../SupabaseConfig.js"></script>
    <style>
        body{
            width: 100%;
            font-family:Arial;
            margin:0;
            padding:0;
            background:#555555;
            display:none;
        }
        html{
            width: 100%;
            height: auto;
            display: flex;
            flex-direction: column;
            align-items: center;  
            font-size: 62.5%;
        }
        #MainBody{
            width:80%;
            min-height:100vh;
            margin:auto;
            background:#ffdddd;
            display:flex;
            flex-direction:column;
            align-items:center;
        }
        #PageNaviggationBox {
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            background: #000000;
            padding: clamp(0.3rem, 1vw, 2rem);
            text-align: center;
        }
        #LogoBox{
            width: 6%;
            height: auto;     
        }
        #LogoBox img{
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #PageNavigationSelect{
            width: 80%;
            font-size: clamp(1rem, 2vw, 3rem);
            font-weight: bold;
            padding: clamp(0.3rem, 1vw, 2rem);
            border: 4px solid #000000;
        }        
        #AdminList{
            width:90%;
            padding: clamp(1rem, 2vw, 2rem);
        }
        .AdminItem{
            display:flex;
            justify-content:space-between;
            padding: clamp(0.3rem, 1vw, 2rem);
            margin:clamp(0.3rem, 1vw, 2rem) 0;
            background:#fff;
            border-radius:2vw;
            font-size: clamp(1rem, 2vw, 3rem);
            box-shadow:2px 2px 5px rgba(0,0,0,0.3);
        }
        .AdminItem button{
            padding:clamp(0.3rem, 1vw, 2rem);
            background: linear-gradient(180deg, #aa0000, #cc0000, #aa0000);
            color:white;
            border:none;
            border-radius:4vw;
            cursor:pointer;
            width:20%;
            font-size: clamp(1rem, 2vw, 3rem);
            box-shadow:1px 1px 3px rgba(0,0,0,0.2);
        }
        .AdminItem button:hover{
            background: linear-gradient(180deg, #990000, #aa0000, #990000);
            color:#ffff00;
        }
        #AddAdminBox{
            width: 90%;
            padding: clamp(0.3rem, 1vw, 2rem) 0;
            margin: clamp(0.3rem, 1vw, 2rem);
            background: #ffffdd;
            border-radius: 2rem;
            display:flex;
            flex-direction:column;
            align-items:center;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.3);
        }
        #AddAdminBox h2{
            width: 100%;
            text-align: center;
            font-size: clamp(2rem, 3vw, 4rem);
            font-weight: bold;
            color: #0000aa;
        }
        .AdminRows{
            width:96%;
            display:flex;
            align-items:center;
            justify-content:space-evenly;
            padding:clamp(0.3rem, 1vw, 2rem) 0;
        }
        .AdminRows label{
            width:30%;
            font-size:clamp(0.8rem, 1.5vw, 2rem);;
            font-weight:bold;
            padding: clamp(0.3rem, 1vw, 2rem) 0;
        }
        .AdminRows input{
            width:50%;
            padding:clamp(0.3rem, 1vw, 2rem);
            font-size:clamp(1rem, 2vw, 3rem);
            border:2px solid #ccc;
            border-radius:4vw;
        }
        .AdminRows button{
            width:15%;
            padding: clamp(0.3rem, 1vw, 2rem) 0;
            background:#0000aa;
            color:white;
            border-radius:4vw;
            font-size: clamp(1rem, 2vw, 3rem);;
            cursor:pointer;
        }
        #btnAddAdmin{
            width:50%;
            padding: clamp(0.3rem, 1vw, 2rem) ;
            margin: clamp(1rem, 2vw, 3rem) 0;
            background: linear-gradient(180deg, #00aa00, #00cc00, #00aa00);
            color:white;
            border-radius:4vw;
            font-size: clamp(1rem, 2vw, 3rem);;
            font-weight:bold;
            cursor:pointer;
        }
        #btnAddAdmin:hover{
            background: linear-gradient(180deg, #009900, #00aa00, #009900);
            color:#ffff00;
        }
        #passwordStrength{
            width:90%;
            margin-top:clamp(1rem, 2vw, 3rem);;
            font-weight:bold;
        }
    </style>
</head>

<body>
    <div id="MainBody">
        <div id="PageNaviggationBox">
            <div id="LogoBox"><img src="" alt="Logo" width="100" height="100"></div>
            <select id="PageNavigationSelect">   
                <option value="AddAdminPage">Add Admin</option>
                <option value="AdminPage">Admin</option>
                <option value="LibraryPage">Library</option>
                <option value="NoticePage">Notice</option>
                <option value="QuestionBankPage">Question Bank</option>
                <option value="StudentPage">Students</option>
                <option value="TeacherPage">Teachers</option>
                <option value="BalPratibhaPage">Bal Pratibha</option>
                <option value="AboutUsPage">About Us</option>
                <option value="GalleryPage">Gallery</option>
                <option value="SMC_TGC_Page">SMC & TGC</option>
                <option value="HelpingHandPage">Helping Hand</option>
                <option value="HomePage">Home</option>
            </select>            
        </div>
        <div id="AdminList"></div>
        <div id="AddAdminBox">
            <h2>Add New Admin</h2>
            <div class="AdminRows"><label>New Email</label><input type="email" id="newAdminEmail"><button type="button" style="visibility: hidden;">👁</button></div>
            <div class="AdminRows"><label>New Password</label><input type="password" id="newAdminPassword"><button type="button" onclick="togglePass('newAdminPassword')">👁</button></div>
            <div id="passwordStrength"></div>
            <div class="AdminRows"><label>Confirm New Password</label><input type="password" id="confirmNewAdminPassword"><button type="button" onclick="togglePass('confirmNewAdminPassword')">👁</button></div>
            <button id="btnAddAdmin" type="button">Add Admin</button>
        </div>
    </div>

    <script>
    /* ================= AUTH ================= */
    protectAdminPage();
    async function protectAdminPage() {
        const { data: { session } } =
            await supabaseClient.auth.getSession();
        if (!session) {
            alert("Login required");
            window.location.href = "LoginIndex.html";
            return;
        }
        document.body.style.display = "block";
        loadAdmins();
    }

    // -------------------- NAVIGATE PAGES --------------------
const PageNavigationDripDown = document.getElementById("PageNavigationSelect");
PageNavigationDripDown.addEventListener("change", function () {
    const pageMap = {
        "AdminPage": "LogInIndex.html",
        "LibraryPage": "../LibraryPage/LibraryIndex.html",
        "NoticePage": "../NoticePage/NoticeIndex.html",
        "QuestionBankPage": "../QuestionBankPage/QuestionBankIndex.html",
        "StudentPage": "../StudentPage/StudentIndex.html",
        "TeacherPage": "../TeacherPage/TeacherIndex.html",
        "BalPratibhaPage": "../BalPratibhaPage/BalPratibhaIndex.html",
        "AboutUsPage": "../AboutUsPage/AboutUsIndex.html",
        "GalleryPage": "../GalleryPage/GalleryIndex.html",
        "SMC_TGC_Page": "../SMC_TGC_Page/SMC_TGC_Index.html",
        "HelpingHandPage": "../HelpingHandPage/HelpingHandIndex.html",
        "HomePage": "../HomeIndex.html"
    };
    const selectedPage = pageMap[this.value];
    if (selectedPage) {
        window.location.href = selectedPage;
    }
});

    /* ================= LOAD ADMINS ================= */
    async function loadAdmins() {
        const { data, error } = await supabaseClient
            .from("AdminUsers")
            .select("*");
        if (error) {
            console.error(error);
            return;
        }
        const list = document.getElementById("AdminList");
        list.innerHTML = "";
        data.forEach(admin => {
            const div = document.createElement("div");
            div.className = "AdminItem";
            div.innerHTML = `
                <span>${admin.email}</span>
                <button onclick="deleteAdmin('${admin.auth_user_id}')">
                    Delete
                </button>
            `;
            list.appendChild(div);
        });
        console.log("Data:", data);
        console.log("Error:", error);
    }

    /* ================= ADD ADMIN ================= */
    document.getElementById("btnAddAdmin").addEventListener("click", addAdmin);
    async function addAdmin() {
        const btn = document.getElementById("btnAddAdmin");
        const email = newAdminEmail.value.trim();
        const password = newAdminPassword.value;
        const confirm = confirmNewAdminPassword.value;
        if (!email || !password) {
            alert("Fill all fields");
            return;
        }
        if (password !== confirm) {
            alert("Passwords do not match");
            return;
        }
        btn.innerText = "Adding...";
        btn.disabled = true;
        try {
            const res = await fetch(
                "https://wrjivuysumgpoqmabwpw.supabase.co/functions/v1/create-admin",
                {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                }
            );
            const result = await res.json();
            if (!res.ok) {
                alert(result.error || "Failed");
                return;
            }
            alert("Admin added successfully!");
            newAdminEmail.value = "";
            newAdminPassword.value = "";
            confirmNewAdminPassword.value = "";
            const ps = document.getElementById("passwordStrength");
            if (ps) ps.innerText = "";
            loadAdmins();
        } catch (err) {
            console.error(err);
            alert("Network error");
        }
        btn.innerText = "Add Admin";
        btn.disabled = false;
    }

    /* ================= DELETE ================= */
    async function deleteAdmin(authUserId) {
        if (!confirm("Delete this admin?")) return;
        const res = await fetch(
            "https://wrjivuysumgpoqmabwpw.supabase.co/functions/v1/delete-admin",
            {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ authUserId })
            }
        );
        const result = await res.json();
        if (!res.ok) {
            alert(result.error);
            return;
        }
        loadAdmins();
    }

    /* ================= PASSWORD TOGGLE (RESTORED) ================= */
    function togglePass(id) {
        const input = document.getElementById(id);
        input.type = input.type === "password" ? "text" : "password";
    }

    async function loadDynamicLogoAndFavicon() {
        try {
            // Query the table natively using your pre-configured supabaseClient
            const { data, error } = await supabaseClient
                .from('AboutSchoolTable')
                .select('Value')
                .eq('Name', 'SchoolLogo')
                .single(); // Accesses the single matching record directly

            if (error) {
                console.error("Supabase query error loading branding:", error.message);
                return;
            }

            if (data && data.Value) {
                const freshLogoUrl = data.Value;

                // 1. Update the Favicon inside the Document Head
                const faviconElement = document.getElementById('dynamicFavicon');
                if (faviconElement) {
                    faviconElement.href = freshLogoUrl;
                }

                // 2. Update the Logo Image Source inside #LogoBox
                const logoImgElement = document.querySelector('#LogoBox img');
                if (logoImgElement) {
                    logoImgElement.src = freshLogoUrl;
                }
                
                console.log("Logo and Favicon synced dynamically via supabaseClient!");
            }
        } catch (error) {
            console.error("Unexpected error setting up branding layout:", error);
        }
    }
    document.addEventListener('DOMContentLoaded', loadDynamicLogoAndFavicon);
    </script>
</body>
</html>
