<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Admin Login</title>
        <link id="dynamicFavicon" rel="icon" type="image/png" href="" />
        <link rel="stylesheet" href="LoginStyle.css">
    </head>
<body>
    <div id="MainBody">
        <div id="PageNaviggationBox">
            <div id="LogoBox"><img src="" alt="Logo" width="100" height="100"></div>
            <select id="PageNavigationSelect">   
                <option value="AdminPage">Admin</option>
                <option value="HelpingHandPage">Helping Hands</option>
                <option value="HumanResourcePage">Human Resource</option>
                <option value="StudentPage">Students</option>
                <option value="QuestionBankPage">Question Bank</option>
                <option value="NoticePage">Notice</option>
                <option value="LibraryPage">Library</option>
                <option value="TeacherPage">Teachers</option>
                <option value="HomePage">Home</option>
                <option value="BalPratibhaPage">Bal Pratibha</option>
                <option value="AboutUsPage">About Us</option>
                <option value="GalleryPage">Gallery</option>
                <option value="SMC_TGC_Page">SMC & TGC</option>                        
            </select>    
        </div>
        <div class="LogInContainer">
            <div class="LogInBox">
                <h2>Admin Login</h2>
                <p>Enter credentials to access dashboard</p>
                <div id="loginStatus"></div><img src="" width="100" height="100">
                <form id="loginForm" autocomplete="off">
                    <div class="InputGroup">
                        <label>Email</label>
                        <input type="email" id="email" autocomplete="off" required>
                    </div>
                    <div class="InputGroup">
                        <label>Password</label>
                        <div id="PasswordBox">
                            <input type="password" id="password" autocomplete="new-password" required>
                            <button type="button" id="togglePassword">👁️</button>
                        </div>
                    </div>
                    <button type="submit" id="btnLogIn">Sign In</button>
                </form>
                <button id="btnOpenAdmin">Open Admin Panel</button>
                <a href="#" id="forgotPassword">Forgot Password?</a>
                <div id="errorMessage"></div>
            </div>
        </div>
        <div id="FooterPlace">
            <div id="FooterHead">Public Pages</div>
            <div id="FooterBox">
                <a href="../../index.html">Home Page</a>
                <a href="../../StudentPage/StudentIndex.html">Student Page</a>
                <a href="../../SMC_TGC_Page/SMC_TGC_Index.html">SMC_TGC Page</a>
                <a href="../../QuestionBankPage/QuestionBankIndex.html">Question Bank Page</a>
                <a href="../../NoticePage/NoticeIndex.html">Notice Page</a>
                <a href="../../LibraryPage/LibraryIndex.html">Library Page</a>
                <a href="../../HumanResourcePage/HumanResourceIndex.html">Human Resource Page</a>
                <a href="../../HelpingHandPage/HelpingHandIndex.html">Helping Hand Page</a>
                <a href="../../GalleryPage/GalleryIndex.html">Gallery Page</a>
                <a href="../../BalPratibhaPage/BalPratibhaIndex.html">Bal Pratibha Page</a>
                <a href="../../AboutUsPage/AboutUsIndex.html">About Us Page</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../SupabaseConfig.js"></script>
    <script src="LoginScript.js"></script>
</body>
</html>
