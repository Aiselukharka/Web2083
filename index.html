<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Home Page</title>
    <link id="dynamicFavicon" rel="icon" type="image/png" href="" />
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <link rel="stylesheet" href="HomeStyle.css">
</head>
<body>
    <div id="MainBody">
        <div id="SchoolNameBox">
            <img id="SchoolLogo" src="" alt="Logo">
            <div id="SchoolName">School Name Loading ........</div>
            <div id="SchoolAddress">School Address Loading ........</div>
        </div>
        <div id="PageNaviggationBox">
            <button type="button" id="btnCalculator" onclick="openCalculator()">Calculator</button>
            <select id="PageNavigationSelect">   
                <option value="HomePage">Home</option>
                <option value="LibraryPage">Library</option>
                <option value="NoticePage">Notice</option>
                <option value="QuestionBankPage">Question Bank</option>
                <option value="StudentPage">Students</option>
                <option value="HumanResourcePage">Human Resource</option>
                <option value="BalPratibhaPage">Bal Pratibha</option>
                <option value="AboutUsPage">About Us</option>
                <option value="GalleryPage">Gallery</option>
                <option value="SMC_TGC_Page">SMC & TGC</option>
                <option value="HelpingHandPage">Helping Hand</option>
                <option value="AdminPage">Admin</option>
            </select>
            <button type="button" id="btnCalendar" onclick="showCalendar()">Calendar</button>
        </div>
        
        <div class="slider-container">
            <div class="slider-wrapper">
                <div class="slides-area" id="slidesArea">
                    <div class="loader-overlay" id="loaderOverlay">
                        <div class="spinner"></div>
                        <p>Loading from Supabase...</p>
                    </div>
                </div>
                <button class="nav-btn prev-btn" id="prevBtn" style="display: none;">&#10094;</button>
                <button class="nav-btn next-btn" id="nextBtn" style="display: none;">&#10095;</button>
                <div class="slide-counter" id="slideCounter" style="display: none;">1 / 10</div>
            </div>
            <div class="dots-pagination" id="dotsContainer"></div>
        </div>

        <div class="video-gallery-container">
            <h2 class="video-gallery-title">Featured Videos</h2>
            <div class="video-grid" id="videoGrid">
                <div class="video-loader">
                    <div class="spinner"></div>
                    <p>Loading videos...</p>
                </div>
            </div>
        </div>
    <div class="video-modal" id="videoModal">
        <div class="video-modal-content">
            <button class="video-modal-close" id="videoModalClose">&times;</button>
            <div class="video-modal-body" id="videoModalBody">
                <div class="video-wrapper" id="videoWrapper">
                    </div>
                <div class="video-modal-info">
                    <h3 id="videoModalTitle">Video Title</h3>
                    <p id="videoModalDescription">Video Description</p>
                </div>
            </div>
        </div>
    </div>
        <div id="FooterBox">
            <a href="GalleryPage/GalleryIndex.html">Gallery</a>
            <a href="AdminPage/AdminIndex.html">Admin</a>
            <a href="BalPratibhaPage/BalPratibhaIndex.html">Bal Pratibha</a>
            <a href="HelpingHandPage/HelpingHandIndex.html">Helping Hand</a>
            <a href="HumanResourcePage/HumanResourceIndex.html">Human Resources</a>
            <a href="LibraryPage/LibraryIndex.html">Library</a>
            <a href="NoticePage/NoticeIndex.html">Notice</a>
            <a href="QuestionBankPage/QuestionBankIndex.html">Question Bank</a>
            <a href="SMC_TGC_Page/SMC_TGC_Index.html">SMC & TGC</a>
            <a href="StudentPage/StudentIndex.html">Students</a>            
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="SupabaseConfig.js"></script>
    <script src="NepaliCalendar.js"></script>
    <script src="SmartCalculator.js"></script>
    <script src="VideoScript.js"></script>
    <script src="HomeScript.js"></script>
</body>
</html>
