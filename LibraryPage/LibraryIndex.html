<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Library Page</title>
    <link id="dynamicFavicon" rel="icon" type="image/png" href="" />
    <link rel="stylesheet" href="LibraryStyle.css">
</head>
<body>
    <div id="MainBody">
        <div id="PageNaviggationBox">
            <div id="LogoBox"><img src="" alt="Library Logo" width="100" height="100"></div>
            <button type="button" id="btnCalculator" onclick="openCalculator()">Calculator</button>
            <select id="PageNavigationSelect" aria-label="Page navigation">
                <option value="LibraryPage">Library</option>
                <option value="NoticePage">Notice</option>
                <option value="QuestionBankPage">Question Bank</option>
                <option value="StudentPage">Students</option>
                <option value="TeacherPage">Teachers</option>
                <option value="HomePage">Home</option>
                <option value="BalPratibhaPage">Bal Pratibha</option>
                <option value="AboutUsPage">About Us</option>
                <option value="GalleryPage">Gallery</option>
                <option value="SMC_TGC_Page">SMC & TGC</option>
                <option value="HelpingHandPage">Helping Hand</option>
                <option value="AdminPage">Admin</option>
            </select>
            <button type="button" id="btnCalendar" onclick="showCalendar()">Calendar</button>
        </div>
        
        <!-- Class Selection Dropdown -->
        <div id="ClassSelectionDropdownBox">
            <select id="ClassSelectionDropdownSelect">
                <option value="" disabled selected>Select Class</option>
                <option value="Class_1">Class 1</option>
                <option value="Class_2">Class 2</option>
                <option value="Class_3">Class 3</option>
                <option value="Class_4">Class 4</option>
                <option value="Class_5">Class 5</option>
                <option value="Class_6">Class 6</option>
                <option value="Class_7">Class 7</option>
                <option value="Class_8">Class 8</option>
                <option value="Class_9">Class 9</option>
                <option value="Class_10">Class 10</option>
                <option value="Class_11">Class 11</option>
                <option value="Class_12">Class 12</option>
                <option value="MoreBooks">More Books</option>                
            </select>
        </div>
        
        <h2 id="MainHead">📚 Available Books</h2>
        <div id="BookListContainer"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../SupabaseConfig.js"></script>
    <script src="../CustomDialog.js"></script>
    <script src="../SmartCalculator.js"></script>
    <script src="../NepaliCalendar.js"></script>
    <script src="../DateConverter.js"></script>
    <script src="../DocumentReader.js"></script>
    <script src="LibraryScript.js"></script>
</body>
</html>
