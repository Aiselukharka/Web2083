<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <title>Human Resources - School Staff</title>
    <link id="dynamicFavicon" rel="icon" type="image/png" href="" />
    <link rel="stylesheet" href="HumanResourceStyle.css">
</head>
<body>
    <div id="MainBody">
        <div id="HeaderBox">
            <img id="SchoolLogo" src="" alt="Logo">
            <div id="SchoolName">Nepal Secondary School</div>
            <div id="SchoolAddress">Nepalgunj, Nepal</div> 
            <select id="PageNavigationSelect">   
                <option>Human Resource</option>
                <option value="StudentPage">Students</option>
                <option value="QuestionBankPage">Question Bank</option>
                <option value="NoticePage">Notice</option>
                <option value="LibraryPage">Library</option>
                <option value="HomePage">Home</option>
                <option value="BalPratibhaPage">Bal Pratibha</option>
                <option value="AboutUsPage">About Us</option>
                <option value="GalleryPage">Gallery</option>
                <option value="SMC_TGC_Page">SMC & TGC</option>
                <option value="HelpingHandPage">Helping Hand</option>
                <option value="AdminPage">Admin</option>                
            </select>           
        </div>
        
        <!-- Human Resource Display Section -->
        <div id="HumanResourceDisplay">
            <div id="PageTitle">
                <h1>👨‍🏫 Our Human Resources</h1>
                <p>Meet our dedicated team of educators and staff</p>
            </div>
            
            <!-- Filter Buttons -->
            <div id="FilterContainer">
                <button class="filter-btn active" data-filter="all" onclick="filterResources('all')">All</button>
                <button class="filter-btn" data-filter="Staff" onclick="filterResources('Staff')">👨‍🏫 Teachers & Staff</button>
                <button class="filter-btn" data-filter="SMC" onclick="filterResources('SMC')">🏛️ SMC Members</button>
                <button class="filter-btn" data-filter="PTA" onclick="filterResources('PTA')">🤝 PTA Members</button>
            </div>
            
            <!-- Loading Indicator -->
            <div id="LoadingIndicator" style="display: none;">
                <div class="spinner"></div>
                <p>Loading human resources...</p>
            </div>
            
            <!-- Staff Cards Container -->
            <div id="StaffCardsContainer">
                <!-- Cards will be dynamically generated here -->
            </div>
            
            <!-- No Data Message -->
            <div id="NoDataMessage" style="display: none;">
                <div class="no-data-icon">📋</div>
                <h3>No records found</h3>
                <p>No human resources data available at the moment.</p>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../SupabaseConfig.js"></script>
    <script src="../NepaliCalendar.js"></script>
    <script src="../SmartCalculator.js"></script>
    <script src="HumanResourceScript.js"></script>
</body>
</html>
