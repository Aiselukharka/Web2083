<body>
    <div id="MainBody">
        <div id="SchoolNameBox">
            <img id="SchoolLogo" src="" alt="Logo">
            <div id="SchoolName">School Name Loading ........</div>
            <div id="SchoolAddress">School Address Loading ........</div>
        </div>
        <div id="PageNaviggationBox">
            <button type="button" id="btnCalculator" onclick="openCalculator()">Calculator</button>
            <select id="PageNavigationSelect">   
                <option value="GalleryPage">Gallery</option>
                <option value="HumanResourcePage">Human Resource</option>
                <option value="StudentPage">Students</option>
                <option value="QuestionBankPage">Question Bank</option>

            <button type="button" id="btnCalendar" onclick="showCalendar()">Calendar</button>
        </div>        
        
        <h2 style="margin: 20px 0; color: #333;">School Photo Gallery</h2>
        <div id="PublicGalleryContainer"></div>
    
    <div id="GalleryModal" class="modal-overlay">
        <div class="modal-top-bar">
            <button type="button" id="btnZoomIn" title="Zoom In">+</button>
            <button type="button" id="btnZoomOut" title="Zoom Out">&minus;</button>
            <button type="button" id="btnZoomReset" title="Reset Size">&#128472;</button>
            <span class="modal-close" title="Close">&times;</span>
        </div>
        
        <div class="modal-content-wrapper">
            <div class="modal-img-container">
                <img id="ModalTargetImage" src="" alt="Large View">
            </div>
            <p id="ModalTargetDesc"></p>
        </div>
    </div>
